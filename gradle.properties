# ══════════════════════════════════════════════════════════════
#  Gradle 项目配置
# ══════════════════════════════════════════════════════════════

# 构建 JVM 内存。AGP 9 + Kotlin 2.4 的构建峰值较高，
# 4G 是经过验证够用的值；设小了会 OOM，设大了在 CI 上可能超限
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存。
# ⚠️ 排障提示：如果构建报出与 configuration cache 相关的
#    不可序列化异常，先把它改 false 再排查 —— 这个开关
#    会掩盖真正的问题，且部分第三方插件尚未完全兼容
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
# 非传递 R 类：减少 R 类体积、加快编译。
# 代价是引用其它模块的资源必须写全包名，本项目单模块所以无影响
android.nonTransitiveRClass=true
# Jetifier 是给老 support 库迁移用的，现代工程一律关闭 ——
# 开着会明显拖慢构建
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
# 增量编译（默认开启，显式写出便于排障时定位）
kotlin.incremental=true

# 注意：不要设置 android.defaults.buildfeatures.buildconfig=false ——
# 本项目依赖 BuildConfig（飞书包名通过 buildConfigField 注入），
# 全局关闭后即便模块内 buildFeatures 也开了，某些 AGP 版本
# 仍会出现「字段找不到」的诡异编译错误。app/build.gradle.kts 里
# 已显式声明 buildConfig = true，保持唯一来源即可。
