name: Dev Build

# 每次推送到主分支或 PR 时执行。
#
# 这条流水线的职责不是出包，而是**尽快发现问题**：
# 静态检查（依赖注入完整性、字符串一致性）先跑，
# 因为它们几秒就能完成，而编译要几分钟。
# 让最快的检查挡在最前面，能显著缩短反馈周期。
#
# 产物：可安装的 debug APK（含 .debug 后缀，可与正式版共存）

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的旧构建自动取消，避免排队浪费时间
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

env:
  # 统一 Gradle 参数：CI 上关闭守护进程与配置缓存，
  # 每次都是干净环境，守护进程反而占内存
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_ARGS: "--no-daemon --stacktrace"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Android SDK 手工配置（不用 android-actions/setup-android）──
      #
      # 为什么不用那个 action：
      # 它内部会执行 `sdkmanager "tools"` 来装旧版 SDK Tools，
      # 但 `tools` 包早已从 Google 的仓库里移除，于是报
      #   Warning: Failed to find package 'tools'
      #   Error: The process 'sdkmanager' failed with exit code 1
      # 整个 job 在这一步就挂了，后面的编译根本没机会跑。
      #
      # GitHub 的 ubuntu-latest runner **自带** Android SDK
      # （含 cmdline-tools 与 platform-tools），只需：
      #   1. 用环境变量告诉 Gradle SDK 在哪
      #   2. 补装项目需要的 platform（compileSdk 37）
      # 因此这里完全绕开那个 action，自己控制每一步。
      - name: Configure Android SDK
        run: |
          set -e
          # runner 镜像自带 SDK 的固定位置
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          # cmdline-tools 的 bin 目录需要进 PATH（不同镜像版本路径不同，
          # 所以用 find 定位而不是写死版本号）
          CMDBIN=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | head -1)
          if [ -z "$CMDBIN" ]; then
            echo "::warning::未找到 cmdline-tools，尝试直接用已有 platform"
          else
            echo "$CMDBIN" >> "$GITHUB_PATH"
            echo "cmdline-tools bin: $CMDBIN"
          fi

          echo "已有 platforms:"; ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "已有 build-tools:"; ls "$SDK_ROOT/build-tools" 2>/dev/null || true

      - name: Install Android SDK platform 37
        run: |
          set -e
          # 接受许可（非交互）。`|| true` 是因为许可已接受时会返回非零，
          # 那不是错误
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # ── 关键：SDK 目录名**不是** `android-37`，而是带小版本号的 ──
          #
          # Google 从 API 36 之后把 platform 目录改名为
          #   android-37.0 / android-37.1 / android-37.2 ...
          # 而 sdkmanager 的包名 `platforms;android-37` 装出来的
          # 就是 `android-37.0`，**绝不会**生成名为 `android-37` 的目录。
          #
          # 之前写死判断 `-d .../android-37` 导致：
          #   1. 永远判定为「不存在」→ 每次都尝试安装
          #   2. 装完仍是 android-37.0 → 最后那句 exit 1 必定触发
          #   3. 报错信息说「android-37 安装失败」，但实际早就装好了
          # 这是一个「检查条件与真实约定不符」的典型误诊点。
          #
          # 因此改用**通配匹配** android-37*，只看有没有可用的 37 平台。
          has_37() { ls -d "$ANDROID_SDK_ROOT"/platforms/android-37* >/dev/null 2>&1; }

          if has_37; then
            echo "已存在 API 37 平台，跳过安装:"
            ls -d "$ANDROID_SDK_ROOT"/platforms/android-37*
          else
            echo "安装 platforms;android-37（canary 频道）..."
            # channel 取值：0=stable 1=beta 2=dev 3=canary
            # android-37 在 stable 频道查不到，需要 canary
            sdkmanager --channel=3 --install "platforms;android-37" 2>&1 | tail -5 || true
            if ! has_37; then
              echo "canary 频道失败，退回 stable 频道重试..."
              sdkmanager --install "platforms;android-37" 2>&1 | tail -5 || true
            fi
          fi

          echo "最终 platforms:"; ls "$ANDROID_SDK_ROOT/platforms"

          if ! has_37; then
            echo "::error::未找到任何 API 37 平台，后续编译必然报 target not found"
            exit 1
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ── 静态检查：秒级完成，放在编译之前 ──
      #
      # 这几项检查直接对应历史上的几次翻车：
      #   check_eol.py            → gradlew 带 CRLF，shebang 失效 → exit 127
      #   check_koin.py           → 依赖漏注册导致启动闪退
      #   check_comment_balance.py→ 注释嵌套导致整文件解析失败
      #   check_strings.py        → 多语言 key 缺失/占位符不一致导致崩溃
      # 它们能捕获「编译通过但运行时炸」的问题，而编译器抓不到

      # 行尾检查必须放在最前面：gradlew 若是 CRLF，
      # 后面所有 ./gradlew 调用都会以 exit 127 失败，
      # 而日志里**看不到任何 Gradle 输出**，极易误诊为构建配置问题。
      - name: Static check — 关键文件行尾
        run: |
          python3 scripts/check_eol.py .

      - name: Static check — Koin 依赖完整性
        run: |
          python3 scripts/check_koin.py

      # Kotlin 块注释可嵌套，注释里的 `/*`（如写成 `plans/*.json`）
      # 会开启嵌套注释，导致整个文件解析失败 ——
      # 而症状是「其它文件报几十个 Unresolved reference」，极易误诊。
      # 这个检查几毫秒就能跑完，值得放在最前面。
      - name: Static check — Kotlin 块注释配对
        run: |
          python3 scripts/check_comment_balance.py app/src

      - name: Static check — 字符串资源一致性
        run: |
          python3 scripts/check_strings.py

      - name: Run unit tests
        run: ./gradlew $GRADLE_ARGS :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew $GRADLE_ARGS :app:assembleDebug

      # 编译后再跑一次 Koin 检查，并检查产物内的类是否保留 ——
      # R8 只作用于 release，debug 下用这个检查确认
      # 「类名没被意外改写」（某些插件会在编译期做字节码处理）
      - name: Verify APK structure
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"

          # 确认关键组件真的被打进包里。
          # 用 unzip -l 检查 classes.dex 存在即可，
          # 更细的类名检查需要 dex 工具，收益不大
          unzip -l "$APK" | grep -q "classes.dex" || {
            echo "::error::APK 内没有 classes.dex"
            exit 1
          }
          echo "APK 结构检查通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: feishu-checkin-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          retention-days: 7
          if-no-files-found: ignore
