name: Build Release APK

on:
  # 推 tag 即自动出包（如 v1.0.0），省得手动点
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: all
            label: universal
          - abi: arm64-v8a
            label: arm64-v8a
          - abi: x86_64
            label: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 签名文件以 base64 存在 secret 里，构建前还原出来。
      # 未配置 KEYSTORE_BASE64 时跳过，构建会降级为未签名包（不可直接安装）。
      # 注意：GitHub Actions 的 if 条件里不能直接引用 secrets.*，只能经 env 中转。
      #
      # 路径必须落在 app 模块内：build.gradle.kts 用的是 file(keystorePath)，
      # 而 file() 在 app 模块作用域下以 app/ 为基准，写根目录会报
      # "Keystore file '.../app/release.jks' not found"。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 KEYSTORE_BASE64，跳过还原，release 将产出未签名包"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          echo "已还原签名文件到 app/release.jks"

      - name: Static self-check
        run: |
          # Koin 缺失依赖只在运行期暴露，编译通过也照样启动闪退，必须单独校验
          python scripts/check_strings.py app/src/main
          python scripts/check_koin.py app/src/main

      - name: Build Release APK (${{ matrix.label }})
        env:
          CI: 'true'
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease -Pmaa.abi=${{ matrix.abi }} --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/FeishuCheckIn-${{ matrix.label }}.apk"
          done
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.label }}
          path: dist/*.apk
          if-no-files-found: error

      # 只有打了 tag 才发 Release；平时手动跑只留 Artifacts
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
