name: Release Build

# 打 tag（v*）或手动触发时产出签名 Release APK。
#
# 与 dev 流水线的区别：
# 1. 开启 R8 混淆与资源压缩（体积从 ~20MB 降到 ~11MB）
# 2. 使用正式签名（keystore 从 secrets 还原）
# 3. 产出多个 ABI 变体，减小单包体积
#
# ⚠️ keystore 路径基准的坑（踩过两次，务必理解）：
#
# app/build.gradle.kts 里读的环境变量 KEYSTORE_PATH 是
# **仓库根相对路径**，并且代码里用 rootProject.file() 解析。
# 因此：
#   - KEYSTORE_PATH 应该是 "release.jks"（不带前面的目录）
#   - CI 必须把 keystore 还原到**仓库根**，而不是 app/ 下
#
# 之前失败的两种写法：
#   ✗ 代码用 file(keystorePath)   → 以 app/ 为基准，找不到
#   ✗ CI 还原到 app/release.jks 而 secret 还是 "release.jks"
#                                 → gradle 解析成 app/release.jks，对不上
# 现在三方（代码 / secret / 还原位置）统一为「仓库根」。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      no_r8:
        description: '关闭 R8 混淆（排障用，产出未混淆的 release 包）'
        required: false
        default: false
        type: boolean
      build_universal_only:
        description: '只产出 universal 包（加快构建）'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_ARGS: "--no-daemon --stacktrace"

jobs:
  build:
    name: Build Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Android SDK 手工配置（不用 android-actions/setup-android）──
      #
      # 该 action 内部会 `sdkmanager "tools"`，但 `tools` 包已从
      # Google 仓库移除，导致 `Failed to find package 'tools'` →
      # sdkmanager 退出码 1 → 整个 job 挂在这一步。
      # runner 镜像自带 SDK，只需设环境变量 + 补装需要的 platform。
      - name: Configure Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          CMDBIN=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | head -1)
          if [ -n "$CMDBIN" ]; then
            echo "$CMDBIN" >> "$GITHUB_PATH"
            echo "cmdline-tools bin: $CMDBIN"
          else
            echo "::warning::未找到 cmdline-tools"
          fi

          echo "已有 platforms:"; ls "$SDK_ROOT/platforms" 2>/dev/null || true

      - name: Install Android SDK platform 37
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "android-37 已存在，跳过安装"
          else
            echo "安装 platforms;android-37 ..."
            sdkmanager --install "platforms;android-37" 2>&1 | tail -5
          fi

          echo "最终 platforms:"; ls "$ANDROID_SDK_ROOT/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
            gradle-${{ runner.os }}-

      # ── 还原 keystore ──
      #
      # 注意这里用 env 中转再判断，**不能**在 if 里直接引用 secrets：
      #   ✗ if: ${{ secrets.KEYSTORE_BASE64 != '' }}   → Actions 会直接报错
      #   ✓ env + shell 判断                            → 下面这种写法
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，将产出未签名的 release 包"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # 还原到**仓库根**，与 KEYSTORE_PATH 的基准保持一致
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ls -l release.jks
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ── 静态检查（与 dev 流水线一致，release 前必须通过）──
      - name: Static check — Koin 依赖完整性
        run: python3 scripts/check_koin.py

      - name: Static check — Kotlin 块注释配对
        run: python3 scripts/check_comment_balance.py app/src

      - name: Static check — 字符串资源一致性
        run: python3 scripts/check_strings.py

      # 注意跑的是 testDebugUnitTest 而非 testReleaseUnitTest。
      #
      # AGP 只为 debug 变体创建 unitTest 任务，release 没有 ——
      # 写 testReleaseUnitTest 会直接报 "task not found"，
      # 那是任务不存在，不是测试失败，容易被误读成代码有问题。
      # （曾试图用 androidComponents 打开 release 的 unitTest 变体，
      #   但 enableUnitTest 所属的 HasUnitTestBuilder 不在构建脚本
      #   classpath 上，Kotlin DSL 解析不到该属性。详见 app/build.gradle.kts）
      #
      # 单测覆盖的是纯 JVM 逻辑（时间计算、结果语义），不涉及混淆，
      # 因此跑 debug 变体的测试已足够。
      - name: Run unit tests
        run: ./gradlew $GRADLE_ARGS :app:testDebugUnitTest

      # ── 构建 ──
      #
      # 签名相关环境变量统一在这里注入，gradle 侧按
      # 「仓库根相对路径」解析。
      #
      # MAA_NO_R8 是排障开关：release 包若闪退且怀疑是混淆问题，
      # 手动触发时打开它，产出未混淆的包做 A/B 对照 ——
      # 两个包的崩溃行为差异能立刻定位是不是 R8 的锅
      - name: Build release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAA_NO_R8: ${{ github.event.inputs.no_r8 }}
        run: |
          set -e
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning::无签名配置，构建未签名包"
            unset KEYSTORE_PATH
          fi
          if [ "${{ github.event.inputs.build_universal_only }}" = "true" ]; then
            echo "只构建 universal 包"
            ./gradlew $GRADLE_ARGS :app:assembleRelease
          else
            ./gradlew $GRADLE_ARGS :app:assembleRelease
          fi

      # ── 校验签名真的生效 ──
      #
      # 这里有个容易误判的地方：**APK 签名块不在 META-INF/ 里**。
      # v2/v3 签名位于 ZIP 中央目录之后的 APK Signing Block，
      # 特征是魔数 "APK Sig Block 42"。
      # 只扫 META-INF 会把已签名的包误判成「未签名」。
      - name: Verify signature
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 release APK"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"

          if grep -a -q "APK Sig Block 42" "$APK"; then
            echo "✓ 检测到 APK Signing Block（v2/v3 签名存在）"
          else
            echo "::warning::未检测到签名块，APK 可能未签名"
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "::error::已配置 keystore 但产物未签名，请检查签字配置"
              exit 1
            fi
          fi

          # 确认 dex 已在 R8 后合并
          DEX_COUNT=$(unzip -l "$APK" | grep -c "classes.*\.dex" || true)
          echo "dex 文件数: $DEX_COUNT"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: feishu-checkin-release-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/mapping/**
          retention-days: 7
          if-no-files-found: ignore
